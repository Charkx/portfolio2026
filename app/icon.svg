<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <!-- halo néon -->
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fond noir arrondi (le logo est pensé sur fond sombre) -->
  <rect width="100" height="100" rx="22" fill="#000000"/>

  <!-- logo : chevron + M, tout en cyan néon, centré -->
  <g transform="translate(8.75 -5) scale(1.1)" fill="none" stroke="#00f0ff" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <path d="M25 30 L5 50 L25 70"/>
    <path d="M40 70 L40 30 L55 55 L70 30 L70 70"/>
  </g>
</svg>
